<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Select a Character</title>
	<link rel="stylesheet" href="xtr_styles.css">
</head>

<body>
	<header class="title-bar">
		<h1>Select a Character</h1>
	</header>

	<main class="selector">
		<div class="image-panel" aria-label="Image area">
			<div class="image-panel-copy" aria-live="polite">
				<p class="image-panel-copy__text"></p>
			</div>
		</div>

		<section class="character-grid" aria-label="Character selection">
			<button class="character-button" type="button" aria-label="Character 1"
				data-description="Character 1 opens the first signal."><img src="pics/ch/ch.png"
					alt="Character 1"></button>
			<button class="character-button" type="button" aria-label="Character 2"
				data-description="Character 2 keeps the rhythm moving."><img src="pics/ch/cy.png"
					alt="Character 2"></button>
			<button class="character-button" type="button" aria-label="Character 3"
				data-description="Character 3 cuts in with a sharp shift."><img src="pics/ch/cl.png"
					alt="Character 3"></button>
			<button class="character-button" type="button" aria-label="Character 4"
				data-description="Character 4 pushes the frame wider."><img src="pics/ch/cl.svg"
					alt="Character 4"></button>
			<button class="character-button" type="button" aria-label="Character 5"
				data-description="Character 5 brings a colder edge."><img src="pics/ch/kn.png"
					alt="Character 5"></button>
			<button class="character-button" type="button" aria-label="Character 6"
				data-description="Character 6 leans into the next beat."><img src="pics/ch/mar.png"
					alt="Character 6"></button>
			<button class="character-button" type="button" aria-label="Character 7"
				data-description="Character 7 holds the center line."><img src="pics/ch/smj.png"
					alt="Character 7"></button>
			<button class="character-button" type="button" aria-label="Character 8"
				data-description="Character 8 lands with a harder impact."><img src="pics/ch/sstr.png"
					alt="Character 8"></button>
			<button class="character-button" type="button" aria-label="Character 9"
				data-description="Character 9 brightens the whole stage."><img src="pics/ch/wf.png"
					alt="Character 9"></button>
			<button class="character-button" type="button" aria-label="Character 10"
				data-description="Character 10 closes the sequence cleanly."><img src="pics/ch/xtr.png"
					alt="Character 10"></button>
			<button class="character-button" type="button" aria-label="Character 11"
				data-description="Character 11 adds a heavier pulse."><img src="pics/ch/222.png"
					alt="Character 11"></button>
			<button class="character-button" type="button" aria-label="Character 12"
				data-description="Character 12 keeps the motion steady."><img src="pics/ch/777.png"
					alt="Character 12"></button>
			<button class="character-button" type="button" aria-label="Character 13"
				data-description="Character 13 sharpens the transition."><img src="pics/ch/ch.svg"
					alt="Character 13"></button>
			<button class="character-button" type="button" aria-label="Character 14"
				data-description="Character 14 bends the tempo sideways."><img src="pics/ch/clCHANGE.svg"
					alt="Character 14"></button>
			<button class="character-button" type="button" aria-label="Character 15"
				data-description="Character 15 makes the cut more dramatic."><img src="pics/ch/kn.svg"
					alt="Character 15"></button>
			<button class="character-button" type="button" aria-label="Character 16"
				data-description="Character 16 tightens the visual rhythm."><img src="pics/ch/knCHANGE.svg"
					alt="Character 16"></button>
			<button class="character-button" type="button" aria-label="Character 17"
				data-description="Character 17 arrives with a louder contrast."><img src="pics/ch/wfCHANGE.svg"
					alt="Character 17"></button>
			<button class="character-button" type="button" aria-label="Character 18"
				data-description="Character 18 softens the edge before the next shift."><img src="pics/ch/cy.svg"
					alt="Character 18"></button>
			<button class="character-button" type="button" aria-label="Character 19"
				data-description="Character 19 holds the final tension."><img src="pics/ch/etr.png"
					alt="Character 19"></button>
			<button class="character-button" type="button" aria-label="Character 20"
				data-description="Character 20 resets the frame for another run."><img src="pics/ch/ch.png"
					alt="Character 20"></button>
		</section>
	</main>

	<script src="xtr_rules.js" defer></script>
</body>

</html>
